name: LayahTools CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    name: Test & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-tool-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pdf-tool-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Synchronize PDFium WASM
        run: npm run copy-wasm

      - name: Run Test Suites (Workspace, Merge, Editor, Regression & Visual Diff)
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
